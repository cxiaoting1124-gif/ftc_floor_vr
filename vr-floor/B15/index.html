<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VR 手指控制版</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <iframe id="vrFrame" src="./vr-player.html" allow="fullscreen"></iframe>

  <script>
    const frame = document.getElementById("vrFrame");
    const sensitivity = 0.25; // 🎚️ 拖曳靈敏度

    let startX = 0, startY = 0;

    // 🔹 開始觸控
    window.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    }, { passive: true });

    // 🔹 拖曳中
    window.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        frame.contentWindow.postMessage({ type: "panTilt", dx: -dx * sensitivity, dy: -dy * sensitivity }, "*");
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
      e.preventDefault();
    }, { passive: false });

    // 🔹 結束觸控
    window.addEventListener("touchend", () => {}, { passive: true });
  </script>
</body>
</html>
