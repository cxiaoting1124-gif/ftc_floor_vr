<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>default</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Verdana, Arial, Helvetica, sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      z-index: 0;
    }

    #enableGyroBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: white;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: all 0.2s;
    }

    #enableGyroBtn:active {
      transform: scale(0.97);
    }

    ::-webkit-scrollbar {
      background-color: rgba(0,0,0,0.5);
      width: 0.75em;
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.5);
    }
  </style>
</head>

<body>
  <!-- pano2vr 容器 -->
  <div id="container">
    <br>Loading...<br><br>
    This content requires HTML5 with CSS3 3D Transforms or WebGL.
  </div>

  <!-- 啟用體感按鈕 -->
  <div id="enableGyroBtn" onclick="enableGyro()">啟用體感</div>

  <!-- pano2vr 主程式 -->
  <script src="pano2vr_player.js"></script>
  <script>
    // 建立 pano2vr player 實例
    const pano = new pano2vrPlayer("container");

    window.addEventListener("load", () => {
      pano.readConfigUrlAsync("pano.xml");
    });

    // 啟用體感函式
    function enableGyro() {
      const btn = document.getElementById("enableGyroBtn");

      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission()
          .then((response) => {
            if (response === "granted") {
              console.log("✅ 體感已啟用");
              pano.setGyroMode(true);
              btn.style.display = "none";
            } else {
              alert("請允許體感權限");
            }
          })
          .catch((err) => alert("錯誤：" + err));
      } else {
        // Android 或桌面裝置
        pano.setGyroMode(true);
        btn.style.display = "none";
      }
    }
  </script>
</body>
</html>
