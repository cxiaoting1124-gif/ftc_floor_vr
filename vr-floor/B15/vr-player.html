<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>VR Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    #container { width:100%; height:100%; touch-action:none; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="pano2vr_player.js"></script>
  <script>
    const pano = new pano2vrPlayer("container");
    window.addEventListener("load", () => pano.readConfigUrlAsync("pano.xml"));

    // 👇 接收外層 postMessage 傳進來的控制指令
    window.addEventListener("message", (event) => {
      if (!pano || typeof pano.getPan !== "function") return;
      const data = event.data;
      if (data.type === "panTilt") {
        pano.setPan(pano.getPan() + data.dx);
        pano.setTilt(pano.getTilt() + data.dy);
      }
    });
  </script>
</body>
</html>
